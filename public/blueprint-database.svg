<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980"><defs><style>.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.title{fill:#0f172a;font:700 40px Arial}.sub{fill:#64748b;font:20px Arial}.h{fill:#2563eb;font:700 21px Arial}.t{fill:#334155;font:16px Arial}.small{fill:#64748b;font:14px Arial}.line{stroke:#94a3b8;stroke-width:3;fill:none}.key{fill:#15803d;font:700 14px Arial}</style></defs><rect class="bg" width="1500" height="980" rx="28"/><rect x="1" y="1" width="1498" height="978" rx="27" fill="none" stroke="#dbe5f1"/><text class="title" x="60" y="70">AI UAT Engineer — M100 Data &amp; Traceability Model</text><text class="sub" x="60" y="108">Tenant-safe persistence from identity and products through missions, evidence, dependency memory, portfolio intelligence and autonomy governance</text><rect class="panel" x="55" y="165" width="225" height="145" rx="18"/><text class="h" x="80" y="205">COMPANY</text><text class="key" x="80" y="236">company_id</text><text class="t" x="80" y="266">name • slug • active</text><text class="t" x="80" y="292">tenant boundary</text><rect x="330" y="145" width="225" height="185" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text class="h" x="355" y="185">USERS / ROLES</text><text class="key" x="355" y="216">user_id • company_id</text><text class="t" x="355" y="246">email • password hash</text><text class="t" x="355" y="272">role • active • SSO mapping</text><text class="t" x="355" y="298">session / audit identity</text><rect x="605" y="165" width="225" height="145" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="630" y="205" fill="#15803d" font-family="Arial" font-size="21" font-weight="700">PRODUCTS</text><text class="key" x="630" y="236">product_id • company_id</text><text class="t" x="630" y="266">name • base_url</text><text class="t" x="630" y="292">environment • auth reference</text><rect x="880" y="165" width="245" height="145" rx="18" fill="#fff7ed"