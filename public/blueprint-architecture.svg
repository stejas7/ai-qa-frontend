 AI</text><text x="105" y="124" fill="#0f172a" font-size="18">RAG + Agents</text><text x="105" y="156" fill="#64748b" font-size="15">OpenAI + fallback</text></g><text x="1095" y="280" fill="#64748b" font-size="36">→</text><g transform="translate(1130 190)"><rect width="210" height="160" rx="22" fill="#fff7ed" stroke="#fed7aa"/><text x="105" y="56" fill="#c2410c" font-size="20" font-weight="700">PLAYWRIGHT</text><text x="105" y="96" fill="#0f172a" font-size="18">Browser execution</text><text x="105" y="126" fill="#64748b" font-size="15">Evidence capture</text></g></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="430" y="420" width="260" height="72" rx="18" fill="#eff6ff" stroke="#bfdbfe"/><text x="560" y="452" fill="#2563eb" font-size="18" font-weight="700">PostgreSQL + Evidence</text><text x="560" y="478" fill="#475569" font-size="14">Users • products • runs • traceability</text><rect x="730" y="420" width="260" height="72" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/><text x="860" y="452" fill="#15803d" font-size="18" font-weight="700">AWS Runtime</text><text x="860" y="478" fill="#475569" font-size="14">Docker • EC2 • Nginx • HTTPS</text></g></svg>