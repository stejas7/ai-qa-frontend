<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI UAT Engineer Product Blueprint</title>
  <desc id="desc">One visual combining product flow, architecture, technology stack and M1 to M20 learning roadmap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111a2f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16c79a"/><stop offset=".55" stop-color="#2f80ed"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.muted{fill:#94a3b8}.green{fill:#4ade80}.blue{fill:#38bdf8}.purple{fill:#c084fc}.amber{fill:#fbbf24}.panel{fill:#0b1628;stroke:#233652;stroke-width:1.5}.box{fill:#101f35;stroke:#335076;stroke-width:1.3}.small{font-size:18px}.tiny{font-size:15px}.label{font-size:16px;font-weight:700;letter-spacing:.04em}.head{font-size:28px;font-weight:800}.flow{font-size:17px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="8" fill="url(#accent)"/>

  <text x="60" y="72" class="t" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">AI UAT ENGINEER — PRODUCT BLUEPRINT</text>
  <text x="60" y="108" class="t muted" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">What the product does • how it is built • technologies used • how the learning roadmap evolved</text>

  <rect x="45" y="140" width="1510" height="155" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="70" y="178" class="t purple label">END-TO-END PRODUCT FLOW</text>
  <g class="t flow">
    <rect x="72" y="205" width="175" height="58" rx="14" class="box"/><text x="160" y="240" text-anchor="middle">1. Requirement</text>
    <text x="260" y="240" class="blue">→</text>
    <rect x="282" y="205" width="175" height="58" rx="14" class="box"/><text x="370" y="231" text-anchor="middle">2. AI Test</text><text x="370" y="251" text-anchor="middle">Design</text>
    <text x="470" y="240" class="blue">→</text>
    <rect x="492" y="205" width="175" height="58" rx="14" class="box"/><text x="580" y="231" text-anchor="middle">3. RAG</text><text x="580" y="251" text-anchor="middle">Context</text>
    <text x="680" y="240" class="blue">→</text>
    <rect x="702" y="205" width="175" height="58" rx="14" class="box"/><text x="790" y="231" text-anchor="middle">4. Agent</text><text x="790" y="251" text-anchor="middle">Orchestration</text>
    <text x="890" y="240" class="blue">→</text>
    <rect x="912" y="205" width="175" height="58" rx="14" class="box"/><text x="1000" y="231" text-anchor="middle">5. Browser</text><text x="1000" y="251" text-anchor="middle">Execution</text>
    <text x="1100" y="240" class="blue">→</text>
    <rect x="1122" y="205" width="175" height="58" rx="14" class="box"/><text x="1210" y="231" text-anchor="middle">6. Evidence</text><text x="1210" y="251" text-anchor="middle">Capture</text>
    <text x="1310" y="240" class="blue">→</text>
    <rect x="1332" y="205" width="175" height="58" rx="14" class="box"/><text x="1420" y="231" text-anchor="middle">7. Release</text><text x="1420" y="251" text-anchor="middle">Decision</text>
  </g>

  <rect x="45" y="320" width="1035" height="465" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="70" y="360" class="t blue label">SYSTEM ARCHITECTURE</text>
  <rect x="80" y="390" width="180" height="330" rx="18" class="box"/>
  <text x="170" y="425" text-anchor="middle" class="t head">USERS</text>
  <text x="170" y="468" text-anchor="middle" class="t small">Company Admin</text><text x="170" y="505" text-anchor="middle" class="t small">QA / UAT Team</text><text x="170" y="542" text-anchor="middle" class="t small">Business User</text><text x="170" y="579" text-anchor="middle" class="t small">Platform Admin</text>
  <text x="276" y="558" class="blue" font-size="30">→</text>

  <rect x="310" y="390" width="220" height="330" rx="18" class="box"/>
  <text x="420" y="425" text-anchor="middle" class="t head">FRONTEND</text>
  <text x="420" y="458" text-anchor="middle" class="t small blue">React + TypeScript</text>
  <text x="335" y="505" class="t tiny">• Public product pages</text><text x="335" y="535" class="t tiny">• Login + SSO</text><text x="335" y="565" class="t tiny">• UAT workspace</text><text x="335" y="595" class="t tiny">• Evidence + reports</text><text x="335" y="625" class="t tiny">• Admin analytics</text>
  <text x="545" y="558" class="blue" font-size="30">→</text>

  <rect x="580" y="390" width="285" height="330" rx="18" class="box"/>
  <text x="722" y="425" text-anchor="middle" class="t head">BACKEND</text>
  <text x="722" y="458" text-anchor="middle" class="t small green">Java 21 + Spring Boot</text>
  <text x="610" y="503" class="t tiny">Spring Security / OAuth2</text><text x="610" y="533" class="t tiny">Tenant-aware REST APIs</text><text x="610" y="563" class="t tiny">Requirements / Test Design</text><text x="610" y="593" class="t tiny">Execution / Evidence</text><text x="610" y="623" class="t tiny">Traceability / Analytics</text><text x="610" y="653" class="t tiny">Release Decision</text>

  <rect x="610" y="670" width="225" height="34" rx="9" fill="#173b2c" stroke="#2c8d63"/><text x="722" y="693" text-anchor="middle" class="t tiny">Deterministic fallback</text>
  <text x="880" y="558" class="blue" font-size="30">→</text>

  <rect x="915" y="390" width="135" height="150" rx="18" class="box"/>
  <text x="982" y="425" text-anchor="middle" class="t label purple">AI LAYER</text>
  <text x="982" y="460" text-anchor="middle" class="t tiny">Spring AI</text><text x="982" y="488" text-anchor="middle" class="t tiny">OpenAI</text><text x="982" y="516" text-anchor="middle" class="t tiny">RAG / Agents</text>

  <rect x="915" y="570" width="135" height="150" rx="18" class="box"/>
  <text x="982" y="605" text-anchor="middle" class="t label amber">EXECUTION</text>
  <text x="982" y="640" text-anchor="middle" class="t tiny">Playwright</text><text x="982" y="668" text-anchor="middle" class="t tiny">Screenshots</text><text x="982" y="696" text-anchor="middle" class="t tiny">Diagnostics</text>

  <line x1="722" y1="720" x2="722" y2="754" stroke="#38bdf8" stroke-width="2"/><rect x="595" y="742" width="255" height="28" rx="9" fill="#0d2a3f"/><text x="722" y="762" text-anchor="middle" class="t tiny">PostgreSQL + persistent evidence</text>

  <rect x="1105" y="320" width="450" height="465" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="1130" y="360" class="t green label">TECHNOLOGY STACK</text>
  <g class="t small">
    <text x="1135" y="405" class="green" font-weight="700">Backend</text><text x="1260" y="405">Java 21 • Spring Boot • JPA</text>
    <text x="1135" y="447" class="blue" font-weight="700">AI</text><text x="1260" y="447">Spring AI • OpenAI • RAG</text>
    <text x="1135" y="489" class="purple" font-weight="700">Agents</text><text x="1260" y="489">Orchestration • QA tools</text>
    <text x="1135" y="531" class="amber" font-weight="700">Automation</text><text x="1260" y="531">Playwright • Evidence</text>
    <text x="1135" y="573" class="blue" font-weight="700">Frontend</text><text x="1260" y="573">React • TypeScript • Vite</text>
    <text x="1135" y="615" class="green" font-weight="700">Data</text><text x="1260" y="615">PostgreSQL • Knowledge</text>
    <text x="1135" y="657" class="purple" font-weight="700">Security</text><text x="1260" y="657">OAuth2 • Google • GitHub SSO</text>
    <text x="1135" y="699" class="amber" font-weight="700">Delivery</text><text x="1260" y="699">Docker • GHCR • GitHub Actions</text>
    <text x="1135" y="741" class="blue" font-weight="700">Runtime</text><text x="1260" y="741">AWS EC2 • Nginx • HTTPS</text>
  </g>

  <rect x="45" y="810" width="1510" height="145" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="70" y="850" class="t amber label">LEARNING ROADMAP — M1 TO M20</text>
  <g class="t tiny">
    <rect x="70" y="875" width="270" height="50" rx="12" class="box"/><text x="205" y="897" text-anchor="middle" class="green" font-weight="700">M1–M5 FOUNDATION</text><text x="205" y="916" text-anchor="middle">Mission • RAG • Test generation • automation</text>
    <rect x="365" y="875" width="270" height="50" rx="12" class="box"/><text x="500" y="897" text-anchor="middle" class="blue" font-weight="700">M6–M10 INTELLIGENCE</text><text x="500" y="916" text-anchor="middle">Agents • healing • regression • CI quality gates</text>
    <rect x="660" y="875" width="270" height="50" rx="12" class="box"/><text x="795" y="897" text-anchor="middle" class="purple" font-weight="700">M11–M15 PLATFORM</text><text x="795" y="916" text-anchor="middle">Multi-tenant • security • users • product workflows</text>
    <rect x="955" y="875" width="270" height="50" rx="12" class="box"/><text x="1090" y="897" text-anchor="middle" class="amber" font-weight="700">M16–M20 ENTERPRISE UAT</text><text x="1090" y="916" text-anchor="middle">Admin • SSO • analytics • stabilization • scale</text>
    <rect x="1250" y="875" width="270" height="50" rx="12" fill="#153225" stroke="#2c8d63"/><text x="1385" y="897" text-anchor="middle" class="green" font-weight="700">TARGET: 4.0 STABLE</text><text x="1385" y="916" text-anchor="middle">Self-UAT • security • load • release confidence</text>
  </g>

  <text x="60" y="985" class="t muted" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Learning project: AI UAT Engineer • ai-uat.duckdns.org • Requirement → evidence → release confidence</text>
</svg>