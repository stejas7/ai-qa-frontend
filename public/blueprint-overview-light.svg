<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#0f172a}.sub{font:22px Arial,sans-serif;fill:#475569}.h{font:700 26px Arial,sans-serif;fill:#4f46e5}.b{font:700 19px Arial,sans-serif;fill:#0f172a}.t{font:16px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#475569}.card{fill:#ffffff;stroke:#dbe4ef;stroke-width:2}.soft{fill:#f8fafc}.accent{fill:#eef2ff;stroke:#c7d2fe;stroke-width:2}.green{fill:#ecfdf5;stroke:#a7f3d0;stroke-width:2}.orange{fill:#fff7ed;stroke:#fed7aa;stroke-width:2}.blue{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}.purple{fill:#faf5ff;stroke:#e9d5ff;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#f8fafc"/>
  <rect x="30" y="30" width="1540" height="110" rx="20" fill="#ffffff" stroke="#dbe4ef"/>
  <text x="70" y="82" class="title">AI UAT Engineer — Product Blueprint</text>
  <text x="70" y="118" class="sub">What the product does • How it is built • Technologies used • Architecture • Learning roadmap</text>
  <rect x="1260" y="52" width="250" height="60" rx="14" class="green"/><text x="1285" y="80" class="b">Live Product</text><text x="1285" y="104" class="small">ai-uat.duckdns.org</text>

  <text x="45" y="190" class="h">1. End-to-end UAT flow</text>
  <g>
    <rect x="45" y="215" width="190" height="125" rx="18" class="card"/><text x="75" y="255" class="b">1. Requirement</text><text x="75" y="287" class="t">Business + functional</text><text x="75" y="313" class="t">requirements</text>
    <text x="245" y="280" class="h">→</text>
    <rect x="275" y="215" width="190" height="125" rx="18" class="accent"/><text x="302" y="255" class="b">2. AI Test Design</text><text x="302" y="287" class="t">Scenarios, cases, data</text>
    <text x="475" y="280" class="h">→</text>
    <rect x="505" y="215" width="190" height="125" rx="18" class="blue"/><text x="545" y="255" class="b">3. RAG Context</text><text x="535" y="287" class="t">Knowledge + evidence</text>
    <text x="705" y="280" class="h">→</text>
    <rect x="735" y="215" width="190" height="125" rx="18" class="purple"/><text x="770" y="255" class="b">4. Agents</text><text x="758" y="287" class="t">Plan + orchestrate</text>
    <text x="935" y="280" class="h">→</text>
    <rect x="965" y="215" width="190" height="125" rx="18" class="orange"/><text x="988" y="255" class="b">5. Browser</text><text x="995" y="287" class="t">Playwright execution</text>
    <text x="1165" y="280" class="h">→</text>
    <rect x="1195" y="215" width="160" height="125" rx="18" class="card"/><text x="1220" y="255" class="b">6. Evidence</text><text x="1225" y="287" class="t">Screenshots + logs</text>
    <text x="1365" y="280" class="h">→</text>
    <rect x="1395" y="215" width="160" height="125" rx="18" class="green"/><text x="1410" y="255" class="b">7. Release</text><text x="1415" y="287" class="t">Decision support</text>
  </g>

  <text x="45" y="395" class="h">2. System architecture</text>
  <rect x="45" y="420" width="930" height="360" rx="20" class="card"/>
  <rect x="75" y="475" width="140" height="220" rx="16" class="soft" stroke="#cbd5e1"/><text x="112" y="515" class="b">Users</text><text x="95" y="555" class="t">Company Admin</text><text x="100" y="585" class="t">QA / UAT</text><text x="100" y="615" class="t">Business User</text><text x="98" y="645" class="t">Platform Admin</text>
  <text x="225" y="585" class="h">→</text>
  <rect x="255" y="475" width="155" height="220" rx="16" class="blue"/><text x="285" y="515" class="b">Frontend</text><text x="280" y="555" class="t">React + TS</text><text x="275" y="585" class="t">Login + SSO</text><text x="275" y="615" class="t">UAT workspace</text><text x="275" y="645" class="t">Reports</text>
  <text x="420" y="585" class="h">→</text>
  <rect x="450" y="455" width="250" height="260" rx="16" class="green"/><text x="525" y="500" class="b">Backend</text><text x="500" y="535" class="t">Java 21 + Spring Boot</text><text x="495" y="565" class="t">Security + OAuth2</text><text x="495" y="595" class="t">Requirement / Test APIs</text><text x="495" y="625" class="t">Execution / Evidence</text><text x="495" y="655" class="t">Analytics / Release</text>
  <text x="710" y="540" class="h">→</text>
  <rect x="740" y="455" width="180" height="120" rx="16" class="purple"/><text x="790" y="495" class="b">AI Layer</text><text x="775" y="530" class="t">Spring AI + LLM</text><text x="785" y="558" class="t">RAG + Agents</text>
  <text x="710" y="655" class="h">→</text>
  <rect x="740" y="595" width="180" height="120" rx="16" class="orange"/><text x="765" y="635" class="b">Execution</text><text x="772" y="670" class="t">Playwright</text><text x="770" y="698" class="t">Evidence</text>
  <rect x="450" y="730" width="470" height="35" rx="10" class="blue"/><text x="560" y="753" class="t">PostgreSQL • Knowledge • Persistent evidence</text>

  <text x="1010" y="395" class="h">3. Technology stack</text>
  <rect x="1010" y="420" width="545" height="360" rx="20" class="card"/>
  <text x="1045" y="470" class="b">Backend</text><text x="1180" y="470" class="t">Java 21 • Spring Boot • JPA</text>
  <text x="1045" y="515" class="b">AI</text><text x="1180" y="515" class="t">Spring AI • OpenAI • RAG</text>
  <text x="1045" y="560" class="b">Agents</text><text x="1180" y="560" class="t">Orchestration • QA tools</text>
  <text x="1045" y="605" class="b">Automation</text><text x="1180" y="605" class="t">Playwright • Evidence</text>
  <text x="1045" y="650" class="b">Frontend</text><text x="1180" y="650" class="t">React • TypeScript • Vite</text>
  <text x="1045" y="695" class="b">Data</text><text x="1180" y="695" class="t">PostgreSQL • Knowledge</text>
  <text x="1045" y="740" class="b">Delivery</text><text x="1180" y="740" class="t">Docker • GHCR • GitHub Actions • AWS EC2</text>

  <text x="45" y="835" class="h">4. Learning roadmap</text>
  <rect x="45" y="860" width="1510" height="145" rx="20" class="card"/>
  <rect x="75" y="900" width="270" height="65" rx="14" class="green"/><text x="120" y="928" class="b">M1–M5 Foundation</text><text x="105" y="952" class="small">Mission • RAG • Test generation • Automation</text>
  <text x="355" y="940" class="h">→</text>
  <rect x="390" y="900" width="270" height="65" rx="14" class="blue"/><text x="445" y="928" class="b">M6–M10 Intelligence</text><text x="430" y="952" class="small">Agents • Healing • Regression • CI gates</text>
  <text x="670" y="940" class="h">→</text>
  <rect x="705" y="900" width="270" height="65" rx="14" class="purple"/><text x="760" y="928" class="b">M11–M15 Platform</text><text x="745" y="952" class="small">Multi-tenant • Security • Workflow • Admin</text>
  <text x="985" y="940" class="h">→</text>
  <rect x="1020" y="900" width="270" height="65" rx="14" class="orange"/><text x="1070" y="928" class="b">M16–M20 Enterprise UAT</text><text x="1060" y="952" class="small">SSO • Analytics • Stabilization • Scale</text>
  <text x="1300" y="940" class="h">→</text>
  <rect x="1335" y="900" width="190" height="65" rx="14" class="green"/><text x="1370" y="928" class="b">Target 4.0</text><text x="1362" y="952" class="small">Stable learning build</text>
</svg>