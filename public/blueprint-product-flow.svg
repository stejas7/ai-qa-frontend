<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620"><rect width="1500" height="620" rx="28" fill="#f8fafc"/><text x="70" y="78" fill="#0f172a" font-family="Arial,sans-serif" font-size="40" font-weight="700">What AI UAT Engineer does — M50 flow</text><text x="70" y="118" fill="#475569" font-family="Arial,sans-serif" font-size="20">Tenant setup → requirement intelligence → bounded AI workforce → execution → durable evidence → governed release</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(45 185)"><rect width="155" height="150" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="78" y="50" fill="#334155" font-size="20" font-weight="700">1. Setup</text><text x="78" y="86" fill="#0f172a" font-size="16">Company • Team</text><text x="78" y="114" fill="#64748b" font-size="14">Product • Access</text></g><text x="218" y="270" fill="#64748b" font-size="30">→</text><g transform="translate(245 185)"><rect width="165" height="150" rx="22" fill="#eff6ff" stroke="#93c5fd"/><text x="82" y="50" fill="#1d4ed8" font-size="20" font-weight="700">2. Requirement</text><text x="82" y="86" fill="#0f172a" font-size="16">Upload + analyze</text><text x="82" y="114" fill="#64748b" font-size="14">RAG context</text></g><text x="428" y="270" fill="#64748b" font-size="30">→</text><g transform="translate(455 185)"><rect width="170" height="150" rx="22" fill="#faf5ff" stroke="#c4b5fd"/><text x="85" y="50" fill="#7c3aed" font-size="20" font-weight="700">3. Intelligence</text><text x="85" y="86" fill="#0f172a" font-size="16">Risk • change</text><text x="85" y="114" fill="#64748b" font-size="14">Regression • flaky</text></g><text x="643" y="270" fill="#64748b" font-size="30">→</text><g transform="translate(670 165)"><rect width="185" height="190" rx="22" fill="#f5f3ff" stroke="#ddd6fe"/><text x="92" y="46" fill="#7c3aed" font-size="20" font-weight="700">4. AI Workforce</text><text x="92" y="82" fill="#0f172a" font-size="16">100 capabilities</text><text x="92" y="110" fill="#64748b" font-size="14">bounded mission team</text><text x="92" y="138" fill="#64748b" font-size="14">design • automate</text><text x="92" y="166" fill="#64748b" font-size="14">diagnose • govern</text></g><text x="873" y="270" fill="#64748b" font-size="30">→</text><g transform="translate(900 185)"><rect width="170" height="150" rx="22" fill="#fff7ed" stroke="#fdba74"/><text x="85" y="50" fill="#c2410c" font-size="20" font-weight="700">5. Execute</text><text x="85" y="86" fill="#0f172a" font-size="16">Playwright UI/API</text><text x="85" y="114" fill="#64748b" font-size="14">status • duration</text></g><text x="1088" y="270" fill="#64748b" font-size="30">→</text><g transform="translate(1115 185)"><rect width="165" height="150" rx="22" fill="#ecfeff" stroke="#67e8f9"/><text x="82" y="50" fill="#0e7490" font-size="20" font-weight="700">6. Evidence</text><text x="82" y="86" fill="#0f172a" font-size="16">Screenshots • logs</text><text x="82" y="114" fill="#64748b" font-size="14">durable traceability</text></g><text x="1298" y="270" fill="#64748b" font-size="30">→</text><g transform="translate(1325 165)"><rect width="130" height="190" rx="22" fill="#ecfdf5" stroke="#86efac"/><text x="65" y="46" fill="#15803d" font-size="20" font-weight="700">7. Release</text><text x="65" y="82" fill="#0f172a" font-size="16">READY</text><text x="65" y="108" fill="#0f172a" font-size="16">or BLOCKED</text><text x="65" y="140" fill="#64748b" font-size="13">human authority</text><text x="65" y="164" fill="#64748b" font-size="13">retained</text></g></g><rect x="70" y="410" width="1360" height="125" rx="18" fill="#fff" stroke="#dbe4ef"/><text x="750" y="452" text-anchor="middle" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="700">M47–M50 closes the loop with multi-agent review, prediction/learning, self-UAT and governed release intelligence.</text><text x="750" y="492" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="18">AI recommends. Deterministic Java policy controls. Playwright proves. Evidence explains. Humans decide.</text></svg>