<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <rect width="1400" height="520" rx="28" fill="#081426"/>
  <text x="70" y="80" fill="#ffffff" font-family="Arial,sans-serif" font-size="38" font-weight="700">1. What AI UAT Engineer does</text>
  <text x="70" y="120" fill="#9fb4d3" font-family="Arial,sans-serif" font-size="20">From requirement to evidence-backed release confidence</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(70 190)"><rect width="150" height="150" rx="22" fill="#10233f" stroke="#2dd4bf"/><text x="75" y="64" fill="#2dd4bf" font-size="26" font-weight="700">1</text><text x="75" y="98" fill="#fff" font-size="20" font-weight="700">Requirement</text><text x="75" y="126" fill="#a9b8ce" font-size="14">Business intent</text></g>
    <text x="240" y="275" fill="#6ea8fe" font-size="32">→</text>
    <g transform="translate(270 190)"><rect width="150" height="150" rx="22" fill="#10233f" stroke="#60a5fa"/><text x="75" y="64" fill="#60a5fa" font-size="26" font-weight="700">2</text><text x="75" y="98" fill="#fff" font-size="20" font-weight="700">AI Test Design</text><text x="75" y="126" fill="#a9b8ce" font-size="14">Scenarios + data</text></g>
    <text x="440" y="275" fill="#6ea8fe" font-size="32">→</text>
    <g transform="translate(470 190)"><rect width="150" height="150" rx="22" fill="#10233f" stroke="#a78bfa"/><text x="75" y="64" fill="#a78bfa" font-size="26" font-weight="700">3</text><text x="75" y="98" fill="#fff" font-size="20" font-weight="700">RAG Context</text><text x="75" y="126" fill="#a9b8ce" font-size="14">Grounded knowledge</text></g>
    <text x="640" y="275" fill="#6ea8fe" font-size="32">→</text>
    <g transform="translate(670 190)"><rect width="150" height="150" rx="22" fill="#10233f" stroke="#c084fc"/><text x="75" y="64" fill="#c084fc" font-size="26" font-weight="700">4</text><text x="75" y="98" fill="#fff" font-size="20" font-weight="700">AI Agents</text><text x="75" y="126" fill="#a9b8ce" font-size="14">Plan + orchestrate</text></g>
    <text x="840" y="275" fill="#6ea8fe" font-size="32">→</text>
    <g transform="translate(870 190)"><rect width="150" height="150" rx="22" fill="#10233f" stroke="#f59e0b"/><text x="75" y="64" fill="#f59e0b" font-size="26" font-weight="700">5</text><text x="75" y="98" fill="#fff" font-size="20" font-weight="700">Browser UAT</text><text x="75" y="126" fill="#a9b8ce" font-size="14">Playwright execution</text></g>
    <text x="1040" y="275" fill="#6ea8fe" font-size="32">→</text>
    <g transform="translate(1070 190)"><rect width="150" height="150" rx="22" fill="#10233f" stroke="#22c55e"/><text x="75" y="64" fill="#22c55e" font-size="26" font-weight="700">6</text><text x="75" y="98" fill="#fff" font-size="20" font-weight="700">Evidence</text><text x="75" y="126" fill="#a9b8ce" font-size="14">Screenshots + logs</text></g>
    <text x="1240" y="275" fill="#6ea8fe" font-size="32">→</text>
    <g transform="translate(1260 190)"><rect width="100" height="150" rx="22" fill="#123525" stroke="#22c55e"/><text x="50" y="64" fill="#22c55e" font-size="26" font-weight="700">7</text><text x="50" y="98" fill="#fff" font-size="18" font-weight="700">Release</text><text x="50" y="122" fill="#fff" font-size="18" font-weight="700">Decision</text></g>
  </g>
  <rect x="70" y="390" width="1260" height="70" rx="18" fill="#0d2038"/>
  <text x="700" y="433" text-anchor="middle" fill="#d8e5f8" font-family="Arial,sans-serif" font-size="20">Human review stays in control while AI accelerates design, execution and evidence collection.</text>
