<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><rect width="1600" height="980" rx="28" fill="#fff"/><rect x="1" y="1" width="1598" height="978" rx="27" fill="none" stroke="#dbe5f1"/><text x="70" y="78" fill="#0f172a" font-family="Arial,sans-serif" font-size="40" font-weight="700">AI UAT Engineer — M1 to M100 Roadmap</text><text x="70" y="118" fill="#64748b" font-family="Arial,sans-serif" font-size="20">Foundation → adaptive UAT intelligence → portfolio orchestration → governed enterprise autonomy</text><g font-family="Arial,sans-serif"><g transform="translate(70 170)"><rect width="450" height="180" rx="22" fill="#f0fdfa" stroke="#5eead4"/><text x="28" y="42" fill="#0f766e" font-size="22" font-weight="700">M1–M30 • FOUNDATION + ENTERPRISE</text><text x="28" y="80" fill="#0f172a" font-size="18">Mission • RAG • test design • Playwright • evidence</text><text x="28" y="112" fill="#475569" font-size="16">Tenancy • security • SSO • admin • operations</text><text x="28" y="142" fill="#475569" font-size="16">Integrations • release approval • platform analytics</text></g><g transform="translate(575 170)"><rect width="450" height="180" rx="22" fill="#faf5ff" stroke="#c4b5fd"/><text x="28" y="42" fill="#7c3aed" font-size="22" font-weight="700">M31–M50 • WORKFORCE + GOVERNED AUTONOMY</text><text x="28" y="80" fill="#0f172a" font-size="18">100-agent workforce • provider routing • governance</text><text x="28" y="112" fill="#475569" font-size="16">Quotas • observability • SLO • release intelligence</text><text x="28" y="142" fill="#475569" font-size="16">Multi-agent review • self-UAT • autonomous release gate</text></g><g transform="translate(1080 170)"><rect width="450" height="180" rx="22" fill="#ecfeff" stroke="#67e8f9"/><text x="28" y="42" fill="#0e7490" font-size="22" font-weight="700">M51–M60 • ADAPTIVE UAT INTELLIGENCE</text><text x="28" y="80" fill="#0f172a" font-size="18">Prioritization • traceability • defect prediction</text><t