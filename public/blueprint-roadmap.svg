 y="44" text-anchor="middle" fill="#1d4ed8" font-size="25" font-weight="700">M100 TARGET • GOVERNED ENTERPRISE AUTONOMY</text><text x="500" y="84" text-anchor="middle" fill="#0f172a" font-size="19">AI performs bounded UAT planning, execution, evidence collection, learning and release recommendations.</text><text x="500" y="118" text-anchor="middle" fill="#475569" font-size="17">Policy, SLOs, model governance, audit evidence, human override and rollback controls retain final authority.</text></g></g><text x="800" y="920" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="18">100-agent catalog • bounded specialist teams • explainable decisions • tenant-safe execution • human-governed autonomy</text></svg>