 transform="translate(1030 165)"><rect width="280" height="150" rx="22" fill="#fff7ed" stroke="#fdba74"/><text x="140" y="40" fill="#c2410c" font-size="20" font-weight="700">M35–M42</text><text x="140" y="76" fill="#0f172a" font-size="22" font-weight="700">INTEGRATION + GOVERNANCE</text><text x="140" y="108" fill="#475569" font-size="16">Jira • GitHub • Slack • Teams</text><text x="140" y="132" fill="#475569" font-size="16">policy • audit • approvals • compliance</text></g><g transform="translate(1350 165)"><rect width="180" height="150" rx="22" fill="#f0fdf4" stroke="#86efac"/><text x="90" y="40" fill="#15803d" font-size="20" font-weight="700">M43–M46</text><text x="90" y="76" fill="#0f172a" font-size="20" font-weight="700">RELIABILITY</text><text x="90" y="108" fill="#475569" font-size="15">quota • recovery</text><text x="90" y="132" fill="#475569" font-size="15">observability • SLO</text></g><g transform="translate(420 390)"><rect width="760" height="210" rx="26" fill="#ecfeff" stroke="#67e8f9"/><text x="380" y="46" fill="#0e7490" font-size="22" font-weight="700">M47–M50 • GOVERNED AUTONOMY</text><text x="380" y="84" fill="#0f172a" font-size="28" font-weight="700">Release Intelligence → Multi-Agent Review → Self-UAT → Autonomous Release Gate</text><text x="380" y="124" fill="#475569" font-size="17">Risk scoring • independent specialist consensus • generated/executed UAT • policy-bound release decision</text><text x="380" y="154" fill="#475569" font-size="17">Human override remains available. Tenant policy and SLO guardrails always have final authority.</text><rect x="210" y="170" width="340" height="28" rx="14" fill="#cffafe" stroke="#67e8f9"/><text x="380" y="190" fill="#155e75" font-size="14" font-weight="700">100-AGENT WORKFORCE • BOUNDED SPECIALIST TEAMS</text></g></g><text x="800" y="665" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="18">M35–M50 implementation uses small purpose-built agent teams instead of running all 100 agents for every mission.</text></svg>