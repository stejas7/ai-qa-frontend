name: Deploy Auravis React Preview to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auravis-frontend-ec2
  cancel-in-progress: true

env:
  PREVIEW_PATH: /react-preview
  DEPLOY_DIR: /var/www/auravis-react-preview

jobs:
  build:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_BASE_PATH: /react-preview/
        run: npm run build -- --base=/react-preview/

      - name: Package build
        run: tar -C dist -czf auravis-frontend.tgz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auravis-frontend-${{ github.sha }}
          path: auravis-frontend.tgz
          retention-days: 3

  deploy:
    name: Deploy preview to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: auravis-frontend-${{ github.sha }}

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USERNAME"
          test -n "$EC2_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/auravis_ec2
          chmod 600 ~/.ssh/auravis_ec2
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify EC2 SSH connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if timeout 60 ssh -i ~/.ssh/auravis_ec2 \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=2 \
              "$EC2_USERNAME@$EC2_HOST" 'echo "SSH connection OK"'; then
              exit 0
            fi
            echo "SSH attempt $attempt failed; retrying..."
            sleep 10
          done
          echo "ERROR: Unable to establish SSH connection to EC2"
          exit 1

      - name: Copy React bundle to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/auravis_ec2 \
            -o ConnectTimeout=15 \
            auravis-frontend.tgz \
            "$EC2_USERNAME@$EC2_HOST:/tmp/auravis-frontend.tgz"

      - name: Install preview and configure Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/auravis_ec2 -o ConnectTimeout=15 "$EC2_USERNAME@$EC2_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          DEPLOY_DIR=/var/www/auravis-react-preview
          NGINX_SNIPPET=/etc/nginx/snippets/auravis-react-preview.conf
          SITE=/etc/nginx/sites-available/ai-qa

          sudo install -d -m 755 "$DEPLOY_DIR"
          sudo rm -rf "$DEPLOY_DIR"/*
          sudo tar -xzf /tmp/auravis-frontend.tgz -C "$DEPLOY_DIR"
          sudo chown -R www-data:www-data "$DEPLOY_DIR"
          rm -f /tmp/auravis-frontend.tgz

          cat >/tmp/auravis-react-preview.conf <<'EOF'
          location = /react-preview {
              return 301 /react-preview/;
          }

          location /react-preview/ {
              alias /var/www/auravis-react-preview/;
              try_files $uri $uri/ /react-preview/index.html;
          }
          EOF
          sudo mv /tmp/auravis-react-preview.conf "$NGINX_SNIPPET"
          sudo chmod 644 "$NGINX_SNIPPET"

          if ! sudo grep -q 'auravis-react-preview.conf' "$SITE"; then
            sudo sed -i '/server_name auravis-uat.duckdns.org;/a\    include /etc/nginx/snippets/auravis-react-preview.conf;' "$SITE"
          fi

          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE_SCRIPT

      - name: Verify React preview
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 10); do
            code="$(curl --connect-timeout 5 --max-time 10 -sS -o /tmp/auravis-preview.html -w '%{http_code}' https://auravis-uat.duckdns.org/react-preview/ || true)"
            if [ "$code" = "200" ] && grep -qi '<div id="root"' /tmp/auravis-preview.html; then
              echo "Auravis React preview is healthy"
              exit 0
            fi
            echo "Preview health attempt $attempt returned HTTP $code"
            sleep 3
          done
          echo "ERROR: React preview did not become healthy"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/auravis_ec2
