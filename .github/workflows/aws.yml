name: Deploy Auravis React UI to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auravis-frontend-production
  cancel-in-progress: true

env:
  PUBLIC_BASE_URL: https://auravis-uat.duckdns.org
  DEPLOY_DIR: /var/www/auravis-frontend

jobs:
  build:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript and production build
        run: npm run build -- --base=/

      - name: Package build
        run: tar -C dist -czf auravis-frontend.tgz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auravis-frontend-${{ github.sha }}
          path: auravis-frontend.tgz
          retention-days: 3

  deploy:
    name: Deploy React production UI
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: auravis-frontend-${{ github.sha }}

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          if [ -z "${EC2_HOST:-}" ] || [ -z "${EC2_USERNAME:-}" ] || [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "ERROR: EC2_HOST, EC2_USERNAME and EC2_SSH_KEY are required"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/auravis_ec2
          chmod 600 ~/.ssh/auravis_ec2
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if timeout 60 ssh -i ~/.ssh/auravis_ec2 \
              -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
              "$EC2_USERNAME@$EC2_HOST" 'echo "SSH connection OK"'; then
              exit 0
            fi
            echo "SSH attempt $attempt failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Copy React bundle
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/auravis_ec2 -o ConnectTimeout=15 auravis-frontend.tgz "$EC2_USERNAME@$EC2_HOST:/tmp/auravis-frontend.tgz"

      - name: Install React and switch Nginx root safely
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/auravis_ec2 -o ConnectTimeout=15 "$EC2_USERNAME@$EC2_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          DEPLOY_DIR=/var/www/auravis-frontend
          SITE=/etc/nginx/sites-available/ai-qa
          BACKUP=/etc/nginx/sites-available/ai-qa.pre-react

          sudo install -d -m 755 "$DEPLOY_DIR"
          sudo rm -rf "$DEPLOY_DIR"/*
          sudo tar -xzf /tmp/auravis-frontend.tgz -C "$DEPLOY_DIR"
          sudo chown -R www-data:www-data "$DEPLOY_DIR"
          rm -f /tmp/auravis-frontend.tgz

          if [ -f "$SITE" ] && [ ! -f "$BACKUP" ]; then
            sudo cp "$SITE" "$BACKUP"
          fi

          cat >/tmp/ai-qa-react <<'EOF'
          server {
              listen 80;
              server_name auravis-uat.duckdns.org;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              server_name auravis-uat.duckdns.org;

              ssl_certificate /etc/letsencrypt/live/auravis-uat.duckdns.org/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/auravis-uat.duckdns.org/privkey.pem;

              root /var/www/auravis-frontend;
              index index.html;

              location /api/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }

              location /actuator/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              # Preserve direct links to the legacy Spring Boot pages during migration.
              location ~ ^/(auravis|dashboard|execution-center|technology|real-world-impact)\.html$ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /uat/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          EOF

          sudo mv /tmp/ai-qa-react "$SITE"
          sudo chmod 644 "$SITE"

          if ! sudo nginx -t; then
            echo "ERROR: New Nginx config invalid; restoring previous config"
            if [ -f "$BACKUP" ]; then sudo cp "$BACKUP" "$SITE"; fi
            sudo nginx -t
            exit 1
          fi

          sudo systemctl reload nginx

          if ! curl --connect-timeout 3 --max-time 10 -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
            echo "ERROR: Backend health failed after UI switch; restoring previous Nginx config"
            if [ -f "$BACKUP" ]; then
              sudo cp "$BACKUP" "$SITE"
              sudo nginx -t
              sudo systemctl reload nginx
            fi
            exit 1
          fi
          REMOTE_SCRIPT

      - name: Verify backend through Nginx
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 10); do
            response="$(curl --connect-timeout 5 --max-time 10 -fsS "$PUBLIC_BASE_URL/actuator/health" || true)"
            if echo "$response" | grep -q '"status":"UP"'; then
              echo "$response"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: Backend public health check failed"
          exit 1

      - name: Verify React production UI
        run: |
          set -Eeuo pipefail
          code="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/auravis.html -w '%{http_code}' "$PUBLIC_BASE_URL/" || true)"
          if [ "$code" != "200" ] || ! grep -qi '<div id="root"' /tmp/auravis.html; then
            echo "ERROR: React root UI health check failed with HTTP $code"
            exit 1
          fi
          echo "Auravis React production UI is healthy"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/auravis_ec2
